[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oqm"
version = "1.0.0"
description = "Open Quality Method: an open, testable upload-quality workflow for TikTok editors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
oqm = "oqm.cli:main"

[tool.setuptools]
packages = ["oqm"]
