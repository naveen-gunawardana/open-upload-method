name: Build desktop app

# Run by hand from the Actions tab to get test builds, or push a tag like v1.1.0 to publish them on a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # lets the tag build attach the zips to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: OQM-mac-apple-silicon }
          - { os: macos-15-intel, name: OQM-mac-intel }
          - { os: windows-latest, name: OQM-windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller static-ffmpeg pywebview
      - run: python build_app.py
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/OQM.app ${{ matrix.name }}.zip
      - name: Disk image (macOS, with Applications shortcut)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          ditto dist/OQM.app dmg/OQM.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname OQM -srcfolder dmg -ov -format UDZO ${{ matrix.name }}.dmg
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/OQM -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: program/${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: program/${{ matrix.name }}.*
